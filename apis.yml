name: NODA AI
description: 'NODA AI is a defense-technology company building autonomous force orchestration
  for the frontlines. Founded in 2024 in Austin, Texas by Global War on Terrorism veterans,
  it develops URZA, an AI-native strategic orchestration platform that acts as a tactics
  repository and reasoning engine for real-time task brokering across vendor-agnostic,
  mixed-fleet autonomous assets, integrated with 30+ OEM vehicles and control systems
  from subsurface to space; and LARIA, a synthetic weapons-and-tactics training environment
  that uses digital-twin modeling to develop and test autonomous plays. In February 2026
  the company raised a $25M Series A led by Bessemer Venture Partners to serve the U.S.
  Department of War, the Intelligence Community, and the UK Ministry of Defense. NODA AI
  is a portfolio company of Bessemer Venture Partners and Bloomberg Beta. It publishes no
  public API, developer documentation, or SDKs; its GitHub organization holds no public
  repositories.'
